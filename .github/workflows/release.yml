name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: |
          python -m pip install pytest
          python -m unittest discover -s tests
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all history and branches: the next step needs origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A tag can be pushed from any branch. Only a commit that is already on
      # main may be published.
      - name: The tagged commit must be on main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::the tagged commit $RELEASE_SHA is not on origin/main; merge it first"
            exit 1
          fi
      - name: Tag must equal the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match pyproject version $VERSION"
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
