[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "flakebox"
version = "0.4.6"
description = "Self-hosted flaky-test triage for small teams."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Calas Automations Inc."}]
keywords = ["flaky-tests", "junit", "pytest", "ci", "quarantine", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Testing",
]
[project.urls]
Homepage = "https://github.com/calasdan-sketch/flakebox"
Issues = "https://github.com/calasdan-sketch/flakebox/issues"
Changelog = "https://github.com/calasdan-sketch/flakebox/blob/main/CHANGELOG.md"
[project.scripts]
flakebox = "flakebox.cli:main"
[tool.setuptools]
packages = ["flakebox"]
