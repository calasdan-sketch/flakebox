[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "flakebox"
version = "0.4.0"
description = "Self-hosted flaky-test triage for small teams."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Testing",
]
[project.scripts]
flakebox = "flakebox.cli:main"
[tool.setuptools]
packages = ["flakebox"]
